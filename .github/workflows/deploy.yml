name: Deploy to GitHub Pages

# El sitio se sirve desde la rama gh-pages (Settings → Pages → Deploy from a branch),
# así que el workflow construye el export estático y publica la carpeta `out` en esa rama.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec next build

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch out/.nojekyll
          pnpm exec gh-pages -d out --dotfiles \
            -r "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            -u "GitHub Actions <actions@github.com>" \
            -m "Deploy ${GITHUB_SHA::7}"
